name: Add accessory role aliases
on:
  push:
    branches: [feature/semantic-routing]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/semantic-routing
          fetch-depth: 0
      - name: Add accessory aliases and partial-role guidance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('includes/class-orion-product-search.php');s=p.read_text()
          if '$tokens=$this->keywords($query);' not in s: raise SystemExit('keyword call marker missing')
          s=s.replace('$tokens=$this->keywords($query);','$tokens=$this->keywords($query,$role);',1)
          old="private function keywords(string $text):array{$stop=array('what','which','with','that','this','from','have','need','show','find','looking','please','would','could','product','products','for','the','and','are','you','your','some','best','high','area','durable','suitable','coverage','compatible','selected','where','needed','small','finish');$map=array('matte'=>'matt','ceilings'=>'ceiling','walls'=>'wall','painting'=>'paint','interior'=>'internal');$tokens=preg_split('/[^a-z0-9-]+/i',strtolower($text))?:array();$out=array();foreach($tokens as$t){$t=$map[$t]??$t;if(strlen($t)>2&&!in_array($t,$stop,true))$out[]=$t;}return array_values(array_unique($out));}"
          new="private function keywords(string $text,string $role=''):array{$stop=array('what','which','with','that','this','from','have','need','show','find','looking','please','would','could','product','products','for','the','and','are','you','your','some','best','high','area','durable','suitable','coverage','compatible','selected','where','needed','small','finish');$map=array('matte'=>'matt','ceilings'=>'ceiling','walls'=>'wall','painting'=>'paint','interior'=>'internal');$tokens=preg_split('/[^a-z0-9-]+/i',strtolower($text))?:array();$out=array();foreach($tokens as$t){$t=$map[$t]??$t;if(strlen($t)>2&&!in_array($t,$stop,true))$out[]=$t;}$role_terms=array('roller'=>array('roller','sleeve','microfibre','microfiber','pile'),'roller_sleeve'=>array('roller','sleeve','microfibre','microfiber','pile'),'roller_frame'=>array('roller','frame'),'brush'=>array('paint','brush'),'tray'=>array('paint','roller','tray'));foreach($role_terms[$role]??array()as$t)$out[]=$t;return array_values(array_unique($out));}"
          if old not in s: raise SystemExit('keywords method marker missing')
          p.write_text(s.replace(old,new,1))
          p=Path('includes/class-orion-semantic-product-planner.php');s=p.read_text()
          old='Select only supplied candidate IDs. Match semantically to role and requirements. Never reuse a product. Reject candidates whose description or attributes do not explicitly confirm suitability.'
          new='Select only supplied candidate IDs. Match semantically to role and requirements. Never reuse a product. Reject candidates whose description or attributes do not explicitly confirm suitability. A roller sleeve may satisfy the roller role as a partial accessory when the product data explicitly identifies it as a sleeve; the reason must clearly say that a compatible roller frame is still required. Never describe a sleeve as a complete roller.'
          if old not in s: raise SystemExit('selector prompt marker missing')
          p.write_text(s.replace(old,new,1))
          p=Path('orion-ai-assistant.php');s=p.read_text()
          if 'Version: 0.10.3' not in s or "ORION_AI_VERSION','0.10.3'" not in s: raise SystemExit('version markers missing')
          s=s.replace('Version: 0.10.3','Version: 0.10.4',1).replace("ORION_AI_VERSION','0.10.3'","ORION_AI_VERSION','0.10.4'",1)
          p.write_text(s)
          Path('docs/accessory-role-matching.md').write_text('''# Accessory role matching\n\nVersion 0.10.4 adds role-aware catalogue aliases for application accessories.\n\nThe roller role can discover products named as roller sleeves through terms including `sleeve`, `microfibre`, `microfiber` and `pile`. Brush and tray roles also receive role-specific search vocabulary.\n\nA sleeve is allowed as a partial roller-role recommendation only when the live product data identifies it as a sleeve. The response must state that a compatible roller frame is still required and must never present the sleeve as a complete roller.\n''')
          PY
      - name: Commit
        run: |
          rm .github/workflows/add-accessory-role-aliases.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-orion-product-search.php includes/class-orion-semantic-product-planner.php orion-ai-assistant.php docs/accessory-role-matching.md .github/workflows/add-accessory-role-aliases.yml
          git commit -m "fix: match roller sleeves without treating them as complete rollers"
          git push origin feature/semantic-routing
