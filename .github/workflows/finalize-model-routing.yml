name: Finalize model routing
on:
  push:
    branches: [feature/semantic-routing]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/semantic-routing
          fetch-depth: 0
      - name: Patch integrations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('includes/class-orion-intent-classifier.php');s=p.read_text()
          s=s.replace("$provider=Orion_AI_Provider_Factory::create($settings);","$provider=Orion_AI_Provider_Factory::create($settings,'routing');",1)
          s=s.replace("$out['_diagnostic']=array('status'=>'ok','usage'=>$result['usage']??array());","$out['_diagnostic']=array('status'=>'ok','usage'=>$result['usage']??array(),'attempts'=>$result['attempts']??array(),'fallback_used'=>!empty($result['fallback_used']));",1)
          p.write_text(s)

          p=Path('includes/class-orion-semantic-product-planner.php');s=p.read_text()
          s=s.replace("$provider=Orion_AI_Provider_Factory::create($settings);","$provider=Orion_AI_Provider_Factory::create($settings,'selection');",1)
          s=s.replace("array('status'=>'ok','usage'=>$result['usage']??array())","array('status'=>'ok','usage'=>$result['usage']??array(),'attempts'=>$result['attempts']??array(),'fallback_used'=>!empty($result['fallback_used']))",1)
          p.write_text(s)

          p=Path('includes/class-orion-trace-service.php');s=p.read_text()
          old="$model='google'===$provider?(string)$settings['google_model']:(string)$settings['openrouter_model'];"
          new="$model=Orion_AI_Settings::stage_model($settings,'routing',$provider);"
          if old not in s: raise SystemExit('trace model marker missing')
          p.write_text(s.replace(old,new,1))

          p=Path('includes/class-orion-diagnostics-service.php');s=p.read_text()
          old="'model'=>'google'===Orion_AI_Settings::provider($settings)?$settings['google_model']:$settings['openrouter_model']"
          new="'model'=>Orion_AI_Settings::stage_model($settings,'routing',Orion_AI_Settings::provider($settings))"
          if old not in s: raise SystemExit('diagnostic model marker missing')
          p.write_text(s.replace(old,new,1))

          p=Path('includes/class-orion-cli-command.php');s=p.read_text()
          anchor="$rows[]=array('check'=>'API key','value'=>Orion_AI_Settings::key_source($provider,$settings),'status'=>Orion_AI_Settings::key_configured($provider,$settings)?'OK':'ERROR');"
          extra="$rows[]=array('check'=>'Routing model','value'=>Orion_AI_Settings::stage_model($settings,'routing',$provider),'status'=>'INFO');$rows[]=array('check'=>'Selection model','value'=>Orion_AI_Settings::stage_model($settings,'selection',$provider),'status'=>'INFO');$rows[]=array('check'=>'Answer model','value'=>Orion_AI_Settings::stage_model($settings,'answer',$provider),'status'=>'INFO');$rows[]=array('check'=>'Fallback','value'=>(string)($settings['fallback_provider']??'none').' / '.((string)($settings['fallback_model']??'')?:'provider default'),'status'=>'INFO');"
          if anchor not in s: raise SystemExit('status anchor missing')
          s=s.replace(anchor,anchor+extra,1)
          s=s.replace("$settings['provider']=$provider;if(!Orion_AI_Settings::key_configured", "$settings['provider']=$provider;$settings['fallback_provider']='none';if(!Orion_AI_Settings::key_configured",1)
          marker=" private function count(string $table,string $where=''):int"
          method=''' /** Evaluate semantic routing without creating conversations or handoffs. */
           public function evaluate(array $args,array $assoc_args):void{$settings=Orion_AI_Settings::get();$provider=sanitize_key((string)($assoc_args['provider']??Orion_AI_Settings::provider($settings)));if(!in_array($provider,array('openrouter','google'),true))WP_CLI::error('Provider must be openrouter or google.');$settings['provider']=$provider;$model=sanitize_text_field((string)($assoc_args['model']??Orion_AI_Settings::stage_model($settings,'routing',$provider)));$settings['routing_model']=$model;$settings['selection_model']=$model;$settings['answer_model']=$model;$fallback=sanitize_key((string)($assoc_args['fallback-provider']??'none'));$settings['fallback_provider']=in_array($fallback,array('none','openrouter','google'),true)?$fallback:'none';if(!empty($assoc_args['fallback-model']))$settings['fallback_model']=sanitize_text_field((string)$assoc_args['fallback-model']);$suite=ORION_AI_DIR.'tests/evals/core-conversations.json';$report=(new Orion_AI_Evaluation_Service())->run($settings,$suite);if(!empty($report['summary']['error']))WP_CLI::error($report['summary']['error']);$format=sanitize_key((string)($assoc_args['format']??'table'));if('json'===$format){WP_CLI::log(wp_json_encode($report,JSON_PRETTY_PRINT|JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES));return;}WP_CLI\\Utils\\format_items('table',$report['rows'],array('case','result','intent','diagnostic','duration_ms'));$sum=$report['summary'];WP_CLI::log('Passed: '.$sum['passed'].'/'.$sum['total'].' ('.$sum['pass_rate'].'%)');WP_CLI::log('Average latency: '.$sum['average_ms'].' ms');WP_CLI::log('Total tokens: '.$sum['total_tokens']);if($sum['passed']===$sum['total'])WP_CLI::success('Evaluation passed.');else WP_CLI::warning('Evaluation has failing cases.');}
          '''
          if marker not in s: raise SystemExit('CLI marker missing')
          p.write_text(s.replace(marker,method+marker,1))

          p=Path('includes/class-orion-admin-controller.php');s=p.read_text()
          anchor="$this->field('Google Gemini model', 'google_model', 'text', $settings['google_model'], 'Use a model available to your Google AI Studio account with function calling support.');"
          fields="""$this->field('Routing model', 'routing_model', 'text', $settings['routing_model'], 'Blank inherits the active provider model. Use a fixed tool-capable model for reliable classification.');
                  $this->field('Product selection model', 'selection_model', 'text', $settings['selection_model'], 'Blank inherits the active provider model.');
                  $this->field('Answer model', 'answer_model', 'text', $settings['answer_model'], 'Blank inherits the active provider model.');
                  echo '<p><label><strong>Fallback provider</strong><br><select name="orion_ai_settings[fallback_provider]"><option value="none" ' . selected($settings['fallback_provider'], 'none', false) . '>Disabled</option><option value="openrouter" ' . selected($settings['fallback_provider'], 'openrouter', false) . '>OpenRouter</option><option value="google" ' . selected($settings['fallback_provider'], 'google', false) . '>Google Gemini</option></select></label></p>';
                  $this->field('Fallback model', 'fallback_model', 'text', $settings['fallback_model'], 'Leave blank to use the fallback provider default model.');
                  $this->field('Routing timeout (seconds)', 'routing_timeout', 'number', (string)$settings['routing_timeout']);
                  $this->field('Selection timeout (seconds)', 'selection_timeout', 'number', (string)$settings['selection_timeout']);
                  $this->field('Answer timeout (seconds)', 'answer_timeout', 'number', (string)$settings['answer_timeout']);"""
          if anchor not in s: raise SystemExit('admin model anchor missing')
          p.write_text(s.replace(anchor,anchor+'\n        '+fields,1))
          PY
      - name: Commit
        run: |
          rm .github/workflows/finalize-model-routing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-orion-intent-classifier.php includes/class-orion-semantic-product-planner.php includes/class-orion-trace-service.php includes/class-orion-diagnostics-service.php includes/class-orion-cli-command.php includes/class-orion-admin-controller.php .github/workflows/finalize-model-routing.yml
          git commit -m "feat: wire model stages, fallback settings, and evaluate command"
          git push origin feature/semantic-routing
