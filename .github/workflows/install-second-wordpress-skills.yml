name: Install additional WordPress skills

on:
  push:
    branches: [feature/semantic-routing]

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/semantic-routing
          fetch-depth: 0
      - name: Copy official WordPress skills
        run: |
          git clone --depth 1 --branch trunk https://github.com/WordPress/agent-skills.git /tmp/wordpress-agent-skills
          mkdir -p .github/skills
          for skill in wp-wpcli-and-ops blueprint; do
            rm -rf ".github/skills/$skill"
            cp -R "/tmp/wordpress-agent-skills/skills/$skill" ".github/skills/$skill"
          done
      - name: Commit skills and remove installer
        run: |
          rm .github/workflows/install-second-wordpress-skills.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/skills .github/workflows/install-second-wordpress-skills.yml
          git commit -m "chore: install wp-wpcli-and-ops and blueprint skills"
          git push origin feature/semantic-routing
