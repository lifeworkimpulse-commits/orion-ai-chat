name: Fix diagnose option
on:
  push:
    branches: [feature/semantic-routing]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/semantic-routing
          fetch-depth: 0
      - name: Patch diagnose and traces
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('includes/class-orion-cli-command.php');s=p.read_text()
          old="$prompt=trim((string)($assoc_args['prompt']??implode(' ',$args)));if($prompt==='')WP_CLI::error('Provide --prompt=\"...\".');"
          new="$prompt=trim((string)($assoc_args['message']??implode(' ',$args)));if($prompt==='')WP_CLI::error('Provide --message=\"...\" or a positional message. Note: --prompt is reserved by WP-CLI.');"
          if old not in s: raise SystemExit('diagnose prompt pattern missing')
          p.write_text(s.replace(old,new,1))

          p=Path('includes/class-orion-chat-orchestrator.php');s=p.read_text()
          old="'sources'=>array_column($docs,'source_url')"
          new="'sources'=>array_values(array_unique(array_filter(array_column($docs,'source_url'))))"
          if old not in s: raise SystemExit('source trace pattern missing')
          p.write_text(s.replace(old,new,1))

          p=Path('docs/ai-diagnostics.md');s=p.read_text().replace('--prompt=', '--message=')
          p.write_text(s)

          p=Path('orion-ai-assistant.php');s=p.read_text().replace('Version: 0.8.0','Version: 0.8.1',1).replace("define('ORION_AI_VERSION','0.8.0')","define('ORION_AI_VERSION','0.8.1')",1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          rm .github/workflows/fix-diagnose-option.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-orion-cli-command.php includes/class-orion-chat-orchestrator.php docs/ai-diagnostics.md orion-ai-assistant.php .github/workflows/fix-diagnose-option.yml
          git commit -m "fix: use non-reserved message option for diagnose"
          git push origin feature/semantic-routing
