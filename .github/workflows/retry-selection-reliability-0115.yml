name: Retry selection reliability 0.11.5
on:
  push:
    branches: [feature/semantic-routing]
permissions:
  contents: write
jobs:
  retry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/semantic-routing
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Apply corrected patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          src=Path('.github/workflows/finalize-selection-reliability-0115.yml').read_text()
          script=src.split("python3 - <<'PY'\n",1)[1].split("\n          PY",1)[0]
          script=textwrap.dedent(script).replace('brush|roller','brush(?:es)?|roller',1)
          Path('/tmp/selection-reliability-patch.py').write_text(script)
          PY
          python3 /tmp/selection-reliability-patch.py
      - name: Validate release
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          php -r '
          define("ABSPATH", __DIR__);
          function sanitize_text_field($v){return trim((string)$v);} function sanitize_textarea_field($v){return trim((string)$v);} function sanitize_key($v){return strtolower(preg_replace("/[^a-z0-9_-]/","",(string)$v));} function absint($v){return abs((int)$v);} function wp_json_encode($v){return json_encode($v);} function wp_strip_all_tags($v){return strip_tags((string)$v);}
          require "includes/class-orion-intent-classifier.php";require "includes/class-orion-semantic-product-planner.php";
          $router=new Orion_Intent_Classifier();$rr=new ReflectionClass($router);$fallback=$rr->getMethod("fallback");$fallback->setAccessible(true);$validate=$rr->getMethod("validate");$validate->setAccessible(true);$input=["intent"=>"product_search","topic"=>"garage","confidence"=>1,"state_patch"=>["project_type"=>"garage floor coating","area_m2"=>24],"search_plan"=>[["role"=>"primarycoating","query"=>"floor paint","required"=>true],["role"=>"maskingtape","query"=>"masking tape","required"=>false],["role"=>"dustsheet","query"=>"dust sheet","required"=>false]]];$out=$validate->invoke($router,$input,$fallback->invoke($router));$roles=array_column($out["search_plan"],"role");if($out["intent"]!=="project_recommendation"||!in_array("primary_coating",$roles,true)||!in_array("masking_tape",$roles,true)||in_array("dust_sheet",$roles,true))exit(1);
          $planner=(new ReflectionClass("Orion_Semantic_Product_Planner"))->newInstanceWithoutConstructor();$pr=new ReflectionClass($planner);$allowed=$pr->getMethod("candidate_allowed");$allowed->setAccessible(true);$state=["project_type"=>"garage floor coating","area_m2"=>24];if(!$allowed->invoke($planner,["name"=>"Heavy Duty Floor Paint Grey 5L","categories"=>["Paint"]],"primary_coating",$state))exit(1);if($allowed->invoke($planner,["name"=>"Wall and Ceiling Paint Brushes","categories"=>["Painting"]],"primary_coating",$state))exit(1);if(!$allowed->invoke($planner,["name"=>"Universal Degreaser and Cleaner","categories"=>["Cleaning Chemicals"]],"cleaner",$state))exit(1);if($allowed->invoke($planner,["name"=>"Dry Vacuum Cleaner","categories"=>["Vacuum Cleaners"]],"cleaner",$state))exit(1);echo "Selection reliability OK\n";
          '
          grep -q "name'=>'select_products'" includes/class-orion-semantic-product-planner.php
          python3 -m json.tool tests/evals/core-conversations.json >/dev/null
      - name: Commit validated release
        run: |
          rm .github/workflows/finalize-selection-reliability-0115.yml
          rm .github/workflows/retry-selection-reliability-0115.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-orion-intent-classifier.php includes/class-orion-semantic-product-planner.php includes/class-orion-evaluation-service.php .github/workflows/finalize-selection-reliability-0115.yml .github/workflows/retry-selection-reliability-0115.yml
          git commit -m "feat: complete structured selection reliability 0.11.5"
          git push origin feature/semantic-routing
