name: Fix Orion WP-CLI command names
on:
  push:
    branches: [feature/semantic-routing]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/semantic-routing
          fetch-depth: 0
      - name: Patch command metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('includes/class-orion-cli-command.php');s=p.read_text()
          old="/** Test an AI provider. Use --provider=openrouter or --provider=google. */"
          new="""/**
           * Test an AI provider. Use --provider=openrouter or --provider=google.
           *
           * @subcommand test-provider
           */"""
          if old not in s: raise SystemExit('test provider docblock not found')
          s=s.replace(old,new,1)
          old="$next=wp_next_scheduled(Orion_Cleanup::HOOK);$rows[]=array('check'=>'Cleanup cron','value'=>$next?gmdate('c',$next):'Not scheduled','status'=>$next?'OK':'MISSING');"
          new="$next=wp_next_scheduled(Orion_Cleanup::HOOK);$cron_status=!$next?'MISSING':($next<time()?'OVERDUE':'OK');$rows[]=array('check'=>'Cleanup cron','value'=>$next?gmdate('c',$next):'Not scheduled','status'=>$cron_status);"
          if old not in s: raise SystemExit('cron status block not found')
          s=s.replace(old,new,1)
          old="if('resolve'===$action){$id=absint($args[1]??0);if(!$id)WP_CLI::error('Provide a handoff ID.');if(empty($assoc_args['apply']))"
          new="if('resolve'===$action){$id=absint($args[1]??0);if(!$id)WP_CLI::error('Provide a handoff ID.');$exists=(int)$wpdb->get_var($wpdb->prepare(\"SELECT COUNT(*) FROM {$wpdb->prefix}orion_ai_handoffs WHERE id=%d\",$id));if(!$exists)WP_CLI::error('Handoff #'.$id.' does not exist.');if(empty($assoc_args['apply']))"
          if old not in s: raise SystemExit('handoff resolve block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fixes
        run: |
          rm .github/workflows/fix-wpcli-command-names.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-orion-cli-command.php .github/workflows/fix-wpcli-command-names.yml
          git commit -m "fix: register test-provider and detect overdue cron"
          git push origin feature/semantic-routing
