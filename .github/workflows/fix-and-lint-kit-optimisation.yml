name: Fix and lint kit optimisation
on:
  push:
    branches: [feature/semantic-routing]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/semantic-routing
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Fix planner call
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('includes/class-orion-semantic-product-planner.php');s=p.read_text()
          old="$payload_json));$data="
          new="$payload_json)));$data="
          if old not in s: raise SystemExit('planner call marker missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate release
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          python3 -m json.tool tests/evals/core-conversations.json >/dev/null
      - name: Commit validated fix
        run: |
          rm .github/workflows/fix-and-lint-kit-optimisation.yml
          rm -f docs/lint-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-orion-semantic-product-planner.php docs/lint-result.txt .github/workflows/fix-and-lint-kit-optimisation.yml
          git commit -m "fix: validate semantic kit planner syntax"
          git push origin feature/semantic-routing
