name: Finalize selection safety 0.11.4
on:
  push:
    branches: [feature/semantic-routing]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/semantic-routing
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Patch routing and syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          planner=Path('includes/class-orion-semantic-product-planner.php')
          s=planner.read_text()
          old="$displayed=array_slice($selected,0,max(1,(int)$settings['max_products']);"
          new="$displayed=array_slice($selected,0,max(1,(int)$settings['max_products']));"
          if old not in s: raise SystemExit('planner slice marker missing')
          planner.write_text(s.replace(old,new,1))

          classifier=Path('includes/class-orion-intent-classifier.php')
          s=classifier.read_text()
          old="$resolved=$this->resolve_pending($message,$history,$state);if($resolved)return$resolved;$provider="
          new="$resolved=$this->resolve_pending($message,$history,$state);if($resolved)return$resolved;$policy=$this->deterministic_store_policy($message);if($policy)return$policy;$provider="
          if old not in s: raise SystemExit('classifier entry marker missing')
          s=s.replace(old,new,1)
          old='For store policies use policy_query and no product plan.'
          new='Questions about whether an order, product or pallet can be delivered, shipped, sent, collected or taken to a city, area or postcode are store_policy, not product_search. For store policies use policy_query and no product plan.'
          if old not in s: raise SystemExit('classifier prompt marker missing')
          s=s.replace(old,new,1)
          marker=' private function resolve_pending(string $message,array $history,array $state):?array{'
          method=""" private function deterministic_store_policy(string $message):?array{$text=mb_strtolower(trim($message));$postcode=(bool)preg_match('/\\b(?:gir\\s*0aa|[a-z]{1,2}\\d[a-z\\d]?(?:\\s*\\d[a-z]{2})?)\\b/i',$text);$action=(bool)preg_match('/\\b(deliver|delivered|delivering|ship|shipped|send|sent|dispatch|dispatched|courier|collect|collected|pick[\\s-]?up)\\b/i',$text);$noun=(bool)preg_match('/\\b(delivery|shipping|collection)\\b/i',$text);$destination=(bool)preg_match('/\\b(?:to|into|within)\\s+(?:the\\s+)?[a-z0-9][a-z0-9 .-]{0,50}(?:\\?|$)/i',$text);$implicit=(bool)preg_match('/\\b(?:can|could|will|would|do)\\s+you\\s+(?:get|bring|take)\\b.{0,80}\\bto\\b/i',$text);$policy_form=(bool)preg_match('/\\b(?:do|can|could|will|would)\\s+(?:you|this|the|my|an?\\s+order)\\b/i',$text);$service=(bool)preg_match('/\\b(?:delivery|shipping|collection)\\s+(?:area|areas|available|availability|option|options|policy|cost|charge|charges|postcode|service)\\b/i',$text);if(!(($action&&($postcode||$destination||$policy_form))||($noun&&($postcode||$destination))||$service||($implicit&&($postcode||$destination))))return null;$out=$this->fallback();$out['intent']='store_policy';$out['topic']='delivery';$out['is_new_topic']=true;$out['confidence']=1.0;$out['policy_query']=sanitize_text_field($message);$out['_diagnostic']=array('status'=>'deterministic_store_policy_routing','signals'=>array('postcode'=>$postcode,'action'=>$action,'destination'=>$destination,'implicit'=>$implicit,'service'=>$service));return$out;}\n"""
          if marker not in s: raise SystemExit('classifier method marker missing')
          classifier.write_text(s.replace(marker,method+marker,1))
          PY
      - name: PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Routing and kit smoke tests
        run: |
          php -r '
          define("ABSPATH", __DIR__);
          function sanitize_text_field($v){ return trim((string)$v); }
          function sanitize_key($v){ return strtolower(preg_replace("/[^a-z0-9_-]/", "", (string)$v)); }
          function absint($v){ return abs((int)$v); }
          function wp_json_encode($v){ return json_encode($v); }
          require "includes/class-orion-intent-classifier.php";
          require "includes/class-orion-semantic-product-planner.php";
          $router=new Orion_Intent_Classifier();$rr=new ReflectionClass($router);$route=$rr->getMethod("deterministic_store_policy");$route->setAccessible(true);
          foreach (["Can you get a pallet to M1?","Do you deliver bulk materials to Manchester?","Can this order be sent to SW1A 1AA?"] as $q) { $r=$route->invoke($router,$q); if (($r["intent"]??"")!=="store_policy") { fwrite(STDERR,"Delivery route failed: $q\n"); exit(1); } }
          foreach (["I need a pallet of floor paint","Show me delivery bags"] as $q) { if ($route->invoke($router,$q)!==null) { fwrite(STDERR,"False policy route: $q\n"); exit(1); } }
          $rp=(new ReflectionClass("Orion_Semantic_Product_Planner"))->newInstanceWithoutConstructor();$pr=new ReflectionClass($rp);$component=$pr->getMethod("roller_component");$component->setAccessible(true);$allowed=$pr->getMethod("candidate_allowed");$allowed->setAccessible(true);$compatible=$pr->getMethod("compatible_widths");$compatible->setAccessible(true);$normalise=$pr->getMethod("normalise_plan");$normalise->setAccessible(true);
          $frame=$component->invoke($rp,["name"=>"9 inch Roller Cage Frame"]);$sleeve=$component->invoke($rp,["name"=>"9 inch Medium Pile Roller Sleeve"]);$complete=$component->invoke($rp,["name"=>"9 inch Roller Frame with Two Sleeves"]);
          if($frame["kind"]!=="frame"||$frame["width"]!=9||$sleeve["kind"]!=="sleeve"||$sleeve["width"]!=9||$complete["kind"]!=="complete")exit(1);
          $mini=["name"=>"4 inch Radiator Roller Frame with Two Gloss Sleeves"];
          if($allowed->invoke($rp,$mini,"roller",["project_type"=>"garage floor coating","area_m2"=>24]))exit(1);
          if(!$compatible->invoke($rp,9.0,9.0)||$compatible->invoke($rp,9.0,4.0))exit(1);
          $plan=$normalise->invoke($rp,[["role"=>"dust_sheet"],["role"=>"roller"]],["project_type"=>"garage floor coating"]);if(count($plan)!==1||$plan[0]["role"]!=="roller")exit(1);
          echo "Routing and kit rules OK\n";
          '
      - name: Validate evaluation JSON
        run: python3 -m json.tool tests/evals/core-conversations.json >/dev/null
      - name: Commit validated release
        run: |
          rm .github/workflows/finalize-selection-safety-0114.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-orion-intent-classifier.php includes/class-orion-semantic-product-planner.php .github/workflows/finalize-selection-safety-0114.yml
          git commit -m "feat: complete delivery and kit safety 0.11.4"
          git push origin feature/semantic-routing
