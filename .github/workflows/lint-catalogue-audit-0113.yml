name: Validate catalogue audit 0.11.3
on:
  push:
    branches: [feature/semantic-routing]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/semantic-routing
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Audit rule smoke test
        run: |
          php -r '
          define("ABSPATH", __DIR__);
          require "includes/class-orion-catalogue-audit.php";
          $audit = new Orion_Catalogue_Audit();
          $r = new ReflectionClass($audit);
          $accessory = $r->getMethod("is_accessory_or_hardware");
          $malformed = $r->getMethod("is_malformed_sku");
          foreach (["self-adhesive carpet protection", "contract lever bath mixer filler tap", "stainless steel body filler set 4pce"] as $value) {
            if (!$accessory->invoke($audit, $value)) { fwrite(STDERR, "Accessory rule failed: $value\n"); exit(1); }
          }
          if ($accessory->invoke($audit, "general purpose silicone 280ml")) { fwrite(STDERR, "Silicone was wrongly excluded\n"); exit(1); }
          foreach (["(fl-vpsfc4000sbr) () ()", "(5036770045915) (5036770045908)"] as $value) {
            if (!$malformed->invoke($audit, $value)) { fwrite(STDERR, "Malformed SKU rule failed: $value\n"); exit(1); }
          }
          if ($malformed->invoke($audit, "5010426679037")) { fwrite(STDERR, "Valid SKU was wrongly rejected\n"); exit(1); }
          echo "Audit rules OK\n";
          '
      - name: Validate evaluation JSON
        run: python3 -m json.tool tests/evals/core-conversations.json >/dev/null
      - name: Remove one-time workflow
        run: |
          rm .github/workflows/lint-catalogue-audit-0113.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/lint-catalogue-audit-0113.yml
          git commit -m "chore: complete catalogue audit 0.11.3 validation"
          git push origin feature/semantic-routing
