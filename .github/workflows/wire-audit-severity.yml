name: Wire catalogue audit severity
on:
  push:
    branches: [feature/semantic-routing]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/semantic-routing
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Patch CLI output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('includes/class-orion-cli-command.php');s=p.read_text()
          old="if($counts){WP_CLI::log('Issue counts');WP_CLI\\Utils\\format_items('table',$counts,array('issue','count'));}else WP_CLI::success('No catalogue readiness issues found.');if(!empty($assoc_args['details'])&&!empty($report['issues'])){WP_CLI::log('Issue details (first 200)');WP_CLI\\Utils\\format_items('table',array_slice($report['issues'],0,200),array('product_id','variation_id','product','code','message'));}"
          new="if($counts){WP_CLI::log('Issue counts');WP_CLI\\Utils\\format_items('table',$counts,array('issue','count'));}else WP_CLI::success('No catalogue readiness issues found.');$severity_rows=array();foreach(($report['severity_counts']??array())as$level=>$total)$severity_rows[]=array('severity'=>$level,'count'=>$total);if($severity_rows){WP_CLI::log('Severity counts');WP_CLI\\Utils\\format_items('table',$severity_rows,array('severity','count'));}if(!empty($assoc_args['details'])&&!empty($report['issues'])){WP_CLI::log('Issue details (first 200)');WP_CLI\\Utils\\format_items('table',array_slice($report['issues'],0,200),array('product_id','variation_id','product','code','severity','message'));}"
          if old not in s: raise SystemExit('catalogue audit CLI marker missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate release
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          python3 -m json.tool tests/evals/core-conversations.json >/dev/null
      - name: Commit validated release
        run: |
          rm .github/workflows/wire-audit-severity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-orion-cli-command.php .github/workflows/wire-audit-severity.yml
          git commit -m "feat: complete severity-aware catalogue audit 0.11.2"
          git push origin feature/semantic-routing
