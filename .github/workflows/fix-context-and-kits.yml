name: Fix context and project kits
on:
  push:
    branches: [feature/mvp-hardening]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mvp-hardening
          fetch-depth: 0
      - name: Patch context and kit validation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('includes/class-orion-project-planner.php');s=p.read_text()
          old="""        $roles=$this->roles($project);$products=array();$missing=array();$max_products=max(1,min(12,$max_products));
                  foreach($roles as$role=>$query){if(count($products)>=$max_products)break;$found=$this->products->search(array('query'=>$query,'in_stock'=>true,'limit'=>3));$selected=null;foreach($found as$item){if($this->suitable($item,$role,$project)){$selected=$item;break;}}
                      if($selected){$selected['kit_role']=$role;$selected['recommendation_reason']=$this->role_label($role);$products[]=$selected;}else{$missing[]=$this->role_label($role);}
                  }"""
          new="""        $roles=$this->roles($project);$products=array();$missing=array();$used=array();$max_products=max(1,min(12,$max_products));
                  foreach($roles as$role=>$query){
                      if(count($products)>=$max_products)break;
                      $found=$this->products->search(array('query'=>$query,'in_stock'=>true,'limit'=>5));$selected=null;
                      foreach($found as$item){$id=(int)($item['id']??0);if(!$id||isset($used[$id]))continue;if($this->suitable($item,$role,$project)){$selected=$item;break;}}
                      if($selected){$used[(int)$selected['id']]=true;$selected['kit_role']=$role;$selected['recommendation_reason']=$this->role_label($role);$products[]=$selected;}else{$missing[]=$this->role_label($role);}
                  }"""
          if old not in s: raise SystemExit('recommend block missing')
          s=s.replace(old,new,1)
          old="""    private function suitable(array $item,string $role,array $p):bool{$hay=mb_strtolower(($item['name']??'').' '.($item['short_description']??'').' '.implode(' ',$item['categories']??array()).' '.wp_json_encode($item['attributes']??array()));if('main_paint'===$role&&'exterior_wall_painting'===$p['type']&&!preg_match('/exterior|external|masonry|facade/iu',$hay))return false;if('main_paint'===$role&&'floor_painting'===$p['type']&&!preg_match('/floor|garage|concrete paint|floor coating/iu',$hay))return false;return true;}"""
          new="""    private function suitable(array $item,string $role,array $p):bool{
                  $hay=mb_strtolower(($item['name']??'').' '.($item['short_description']??'').' '.implode(' ',$item['categories']??array()).' '.wp_json_encode($item['attributes']??array()));
                  if('main_paint'===$role&&'exterior_wall_painting'===$p['type'])return(bool)preg_match('/exterior|external|masonry|facade/iu',$hay);
                  if('main_paint'===$role&&'floor_painting'===$p['type'])return(bool)preg_match('/floor|garage|concrete paint|floor coating|epoxy/iu',$hay);
                  $patterns=array('primer'=>'/primer|sealer|stabilis/iu','roller'=>'/roller.*frame|frame.*roller|roller set/iu','sleeve'=>'/roller sleeve|roller refill|roller cover/iu','brush'=>'/brush/iu','tray'=>'/tray|scuttle|paint kettle/iu','repair'=>'/filler|repair|patch/iu','cleaner'=>'/cleaner|degreaser|surface preparation/iu','masking'=>'/masking|tape|dust sheet|protective sheet|cover/iu','fixings'=>'/fixing|screw|clip|adhesive/iu','trim'=>'/trim|profile|moulding|edging/iu','tools'=>'/cutter|saw|knife|cutting/iu','protection'=>'/glove|goggle|mask|ppe|protection/iu');
                  return isset($patterns[$role])?(bool)preg_match($patterns[$role],$hay):true;
              }"""
          if old not in s: raise SystemExit('suitable method missing')
          p.write_text(s.replace(old,new,1))

          p=Path('includes/class-orion-chat-orchestrator.php');s=p.read_text()
          old="$project = $this->planner->analyse($message, $history);"
          new="$policy_intent = $this->is_store_policy_intent($message);\n        $project = $policy_intent ? array('type'=>'','questions'=>array(),'area_m2'=>null,'surface'=>'','colour'=>'','finish'=>'','is_project'=>false,'is_new'=>true) : $this->planner->analyse($message, $history);"
          if old not in s: raise SystemExit('project analyse line missing')
          s=s.replace(old,new,1)
          duplicate="        $policy_intent = $this->is_store_policy_intent($message);\n"
          pos=s.find(duplicate,s.find('$product_intent'))
          if pos!=-1:s=s[:pos]+s[pos+len(duplicate):]
          old="        foreach ($history as $item) $messages[] = array('role' => $item['role'], 'content' => $item['content']);"
          new="        if (!$policy_intent && empty($project['is_new'])) foreach ($history as $item) $messages[] = array('role' => $item['role'], 'content' => $item['content']);"
          if old not in s: raise SystemExit('history loop missing')
          s=s.replace(old,new,1)
          old="$definitions = $this->tools->definitions((int) $settings['max_products']);"
          new="$definitions = $this->tools->definitions((int) $settings['max_products']);\n        if ($policy_intent) $definitions = array_values(array_filter($definitions, static fn($tool) => ($tool['function']['name'] ?? '') === 'get_store_policy'));"
          if old not in s: raise SystemExit('definitions line missing')
          s=s.replace(old,new,1)
          s=s.replace("$products = array_merge($products, $kit['products']);","$products = $kit['products'];",1)
          s=s.replace("            if (!empty($kit['products'])) {","            {",1)
          prompt_old="Write a concise customer answer. Group products by purpose. Mention missing categories honestly. Never claim suitability beyond the supplied product data."
          prompt_new="Ignore any provisional product suggestions made earlier. Write a concise answer using only this verified kit. Group products by purpose and mention missing categories honestly. If the main material is missing, say that no confirmed suitable product was found and that the question needs manager follow-up. Never claim suitability beyond the supplied product data."
          if prompt_old not in s: raise SystemExit('kit rewrite prompt missing')
          s=s.replace(prompt_old,prompt_new,1)
          rules_old='''            . "- Do not add products to a basket. The customer must explicitly click an on-screen button.\\n";'''
          rules_new='''            . "- Do not add products to a basket. The customer must explicitly click an on-screen button.\\n"
                      . "- For delivery, returns, payment and other store policies, answer only from STORE KNOWLEDGE. Ignore unrelated project history.\\n"
                      . "- If STORE KNOWLEDGE does not explicitly answer the question, say you do not have confirmed information and that the question needs manager follow-up.\\n";'''
          if rules_old not in s: raise SystemExit('runtime rules anchor missing')
          s=s.replace(rules_old,rules_new,1)
          docs_line="        $documents = ($product_intent && !$policy_intent) ? array() : $this->knowledge->relevant($message);"
          fallback=docs_line+"\n        if ($policy_intent && !$documents) {\n            $answer = 'I do not have confirmed information about that in the store knowledge base. This question needs manager follow-up. Please contact our team for confirmation.';\n            $this->conversations->record_event('manager_follow_up_needed', array('question'=>$message), $conversation_id);\n            return $this->finish($conversation,$settings,$message,$answer,array(),array(),null,array(),'manager_follow_up_needed');\n        }"
          if docs_line not in s: raise SystemExit('documents line missing')
          s=s.replace(docs_line,fallback,1)
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          rm .github/workflows/fix-context-and-kits.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-orion-project-planner.php includes/class-orion-chat-orchestrator.php .github/workflows/fix-context-and-kits.yml
          git commit -m "fix: isolate policy context and reject role-mismatched products"
          git push origin feature/mvp-hardening
