name: Fix quoted roller width parsing
on:
  push:
    branches: [feature/semantic-routing]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/semantic-routing
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Fix inch parser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('includes/class-orion-semantic-product-planner.php');s=p.read_text()
          old=r'(?:"|″|inches?|inch)\b'
          new=r'(?:"|″|inch(?:es)?\b)'
          if old not in s: raise SystemExit('width regex marker missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate syntax and quoted sizes
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          php -r '
          define("ABSPATH", __DIR__);
          function wp_json_encode($v){ return json_encode($v); }
          require "includes/class-orion-semantic-product-planner.php";
          $p=(new ReflectionClass("Orion_Semantic_Product_Planner"))->newInstanceWithoutConstructor();$r=new ReflectionClass($p);$m=$r->getMethod("width_inches");$m->setAccessible(true);
          foreach (["9\" Roller Cage Frame"=>9.0,"9\"Paint Roller Tray"=>9.0,"4″ Radiator Roller"=>4.0,"12 inch Large Tray"=>12.0] as $text=>$expected) { $actual=$m->invoke($p,$text); if(abs($actual-$expected)>0.01){fwrite(STDERR,"Width failed: $text => $actual\n");exit(1);} }
          echo "Quoted widths OK\n";
          '
          python3 -m json.tool tests/evals/core-conversations.json >/dev/null
      - name: Commit validated fix
        run: |
          rm .github/workflows/fix-inch-width-parsing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-orion-semantic-product-planner.php .github/workflows/fix-inch-width-parsing.yml
          git commit -m "fix: validate quoted roller and tray widths"
          git push origin feature/semantic-routing
