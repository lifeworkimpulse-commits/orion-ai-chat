name: Finalise policy routing
on:
  push:
    branches: [feature/mvp-hardening]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mvp-hardening
          fetch-depth: 0
      - name: Patch routing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('includes/class-orion-chat-orchestrator.php');s=p.read_text()
          old="return (bool) preg_match('/\\b(delivery|shipping|return|refund|payment|warranty|guarantee|contact|location|opening|hours|collection|collect|account|policy|support)\\b|достав|возврат|оплат|гарант|контакт|магазин/iu', $message);"
          new="return (bool) preg_match('/\\b(deliver|delivers|delivered|delivery|shipping|ship|postage|return|refund|payment|warranty|guarantee|contact|location|opening|hours|collection|collect|account|policy|support)\\b|достав|возврат|оплат|гарант|контакт|магазин/iu', $message);"
          if old not in s: raise SystemExit('policy regex not found')
          s=s.replace(old,new,1)
          old="if ($product_intent && !$products) {"
          new="if ($product_intent && !$products && empty($project['is_project'])) {"
          if old not in s: raise SystemExit('unsafe fallback condition not found')
          s=s.replace(old,new,1)
          anchor="$kit = $this->planner->recommend($project, (int) $settings['max_products']);\n            $products = $kit['products'];"
          replacement=anchor+"\n            if (in_array('Main Paint', $kit['missing_roles'], true) || in_array('Main Material', $kit['missing_roles'], true)) {\n                $this->conversations->record_event('manager_follow_up_needed', array('question'=>$message,'project'=>$project,'missing_roles'=>$kit['missing_roles']), $conversation_id);\n            }"
          if anchor not in s: raise SystemExit('kit anchor not found')
          p.write_text(s.replace(anchor,replacement,1))
          PY
      - name: Commit routing fixes
        run: |
          rm .github/workflows/finalise-policy-routing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-orion-chat-orchestrator.php .github/workflows/finalise-policy-routing.yml
          git commit -m "fix: route delivery questions and prevent unsafe project fallbacks"
          git push origin feature/mvp-hardening
