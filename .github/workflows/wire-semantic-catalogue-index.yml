name: Wire semantic catalogue index
on:
  push:
    branches: [feature/semantic-routing]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/semantic-routing
          fetch-depth: 0
      - name: Wire schema, hooks, CLI and diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('orion-ai-assistant.php');s=p.read_text()
          for old in ('Version: 0.10.4',"ORION_AI_VERSION','0.10.4'","ORION_AI_SCHEMA_VERSION','0.8.0'", "'class-orion-product-search.php'"):
              if old not in s: raise SystemExit('main marker missing: '+old)
          s=s.replace('Version: 0.10.4','Version: 0.11.0',1).replace("ORION_AI_VERSION','0.10.4'","ORION_AI_VERSION','0.11.0'",1).replace("ORION_AI_SCHEMA_VERSION','0.8.0'","ORION_AI_SCHEMA_VERSION','0.9.0'",1).replace("'class-orion-product-search.php'","'class-orion-product-index.php','class-orion-product-search.php'",1)
          p.write_text(s)

          p=Path('includes/class-orion-ai-assistant.php');s=p.read_text()
          old='$knowledge=new Orion_Knowledge_Base();$products=new Orion_Product_Search();'
          new='$knowledge=new Orion_Knowledge_Base();$product_index=new Orion_Product_Index();$product_index->register_hooks();$products=new Orion_Product_Search();'
          if old not in s: raise SystemExit('assistant hook marker missing')
          s=s.replace(old,new,1)
          marker=' "CREATE TABLE {$wpdb->prefix}orion_ai_conversations'
          table=''' "CREATE TABLE {$wpdb->prefix}orion_ai_product_index (\n product_id BIGINT UNSIGNED NOT NULL,\n title TEXT NOT NULL,\n content LONGTEXT NOT NULL,\n categories TEXT NOT NULL,\n tags TEXT NOT NULL,\n attributes LONGTEXT NOT NULL,\n product_type VARCHAR(30) NOT NULL,\n stock_status VARCHAR(30) NOT NULL,\n is_visible TINYINT UNSIGNED NOT NULL DEFAULT 1,\n content_hash CHAR(64) NOT NULL,\n updated_at DATETIME NOT NULL,\n PRIMARY KEY  (product_id),\n KEY stock_visibility (stock_status,is_visible),\n FULLTEXT KEY search_text (title,content,categories,tags,attributes)\n) $c;",\n'''
          if marker not in s: raise SystemExit('schema insertion marker missing')
          s=s.replace(marker,table+marker,1);p.write_text(s)

          p=Path('includes/class-orion-cli-command.php');s=p.read_text()
          old="$tables=array('documents','document_chunks','conversations','messages','events','handoffs','traces');"
          new="$tables=array('documents','document_chunks','product_index','conversations','messages','events','handoffs','traces');"
          if old not in s: raise SystemExit('status table marker missing')
          s=s.replace(old,new,1)
          old="$rows[]=array('check'=>'Knowledge chunks','value'=>(string)$this->count($wpdb->prefix.'orion_ai_document_chunks'),'status'=>'INFO');"
          new=old+"$rows[]=array('check'=>'Indexed products','value'=>(string)$this->count($wpdb->prefix.'orion_ai_product_index'),'status'=>'INFO');"
          s=s.replace(old,new,1)
          marker=' /**\n * Audit published WooCommerce catalogue data without making changes.'
          method=''' /**\n * Build the searchable WooCommerce catalogue index. Dry run unless --apply is passed.\n *\n * @subcommand catalogue-index\n */\n public function catalogue_index(array $args,array $assoc_args):void{$limit=absint($assoc_args['limit']??0);$total=function_exists('wc_get_products')?count(wc_get_products(array('status'=>'publish','return'=>'ids','limit'=>$limit>0?min(5000,$limit):-1))):0;WP_CLI::log('Published products available: '.$total);if(empty($assoc_args['apply'])){WP_CLI::warning('Dry run only. Run migrate --apply first, then rerun catalogue-index with --apply.');return;}$done=(new Orion_Product_Index())->reindex_all($limit);WP_CLI::success($done.' product(s) indexed from title, descriptions, categories, tags, attributes and variations.');}\n'''
          if marker not in s: raise SystemExit('CLI insertion marker missing')
          s=s.replace(marker,method+marker,1);p.write_text(s)

          p=Path('uninstall.php');s=p.read_text()
          old="array('orion_ai_document_chunks','orion_ai_documents','orion_ai_messages'"
          new="array('orion_ai_document_chunks','orion_ai_documents','orion_ai_product_index','orion_ai_messages'"
          if old not in s: raise SystemExit('uninstall marker missing')
          p.write_text(s.replace(old,new,1))

          p=Path('includes/class-orion-chat-orchestrator.php');s=p.read_text()
          old="'candidate_counts'=>array_map(static fn($g)=>count($g['candidates']??array()),$kit['plan']),'selected'=>"
          new="'candidate_counts'=>array_map(static fn($g)=>count($g['candidates']??array()),$kit['plan']),'candidate_summaries'=>array_map(static fn($g)=>array('role'=>$g['role']??'','items'=>array_map(static fn($c)=>array('id'=>$c['id']??0,'name'=>$c['name']??'','retrieval'=>$c['retrieval']??array()),$g['candidates']??array())),$kit['plan']),'selected'=>"
          if old not in s: raise SystemExit('trace candidate marker missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          rm .github/workflows/wire-semantic-catalogue-index.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orion-ai-assistant.php includes/class-orion-ai-assistant.php includes/class-orion-cli-command.php includes/class-orion-chat-orchestrator.php uninstall.php .github/workflows/wire-semantic-catalogue-index.yml
          git commit -m "feat: add catalogue index migration, hooks and CLI"
          git push origin feature/semantic-routing
