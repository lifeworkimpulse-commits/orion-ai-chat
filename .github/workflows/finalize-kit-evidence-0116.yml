name: Finalize kit evidence 0.11.6
on:
  push:
    branches: [feature/semantic-routing]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/semantic-routing
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Patch roller evidence and core kit planning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          classifier=Path('includes/class-orion-intent-classifier.php');s=classifier.read_text()
          old='When the user asks for everything needed, a complete kit or all materials, include relevant preparation and application product roles in search_plan.'
          new='When the user asks for everything needed, a complete kit or all materials, include relevant preparation and application product roles in search_plan. For a complete painting kit, prioritise primary_coating, roller, brush, tray, masking_tape and, unless the project surface is a floor, dust_sheet before conditional preparation roles.'
          if old not in s: raise SystemExit('classifier core-kit prompt marker missing')
          classifier.write_text(s.replace(old,new,1))

          planner=Path('includes/class-orion-semantic-product-planner.php');s=planner.read_text()
          start=s.index(' private function normalise_plan(');end=s.index(' private function search_candidates(',start)
          normalise=""" private function normalise_plan(array $plan,array $state):array{$out=array();$seen=array();foreach($plan as$item){if(!is_array($item))continue;$role=$this->canonical_role((string)($item['role']??''));if(!$role||isset($seen[$role]))continue;if($role==='dust_sheet'&&$this->is_floor_project($state))continue;$item['role']=$role;$out[]=$item;$seen[$role]=true;}$complete=$this->wants_complete_kit($state)||count($out)>=6;if($complete&&(isset($seen['primary_coating'])||isset($seen['primary_product']))){$surface=sanitize_text_field((string)($state['surface']??'painted surface'));$core=array('roller'=>'complete paint roller system with frame and sleeve for '.$surface,'tray'=>'paint roller tray compatible with the selected roller','brush'=>'paint brush for cutting in '.$surface,'masking_tape'=>'decorators masking tape for protecting edges');if($this->is_floor_project($state))$core['cleaner']='floor cleaner or degreaser for coating preparation';else$core['dust_sheet']='protective dust sheet for painting';foreach($core as$role=>$query)if(!isset($seen[$role])){$out[]=array('role'=>$role,'query'=>$query,'required'=>false,'requirements'=>array('surface'=>$surface));$seen[$role]=true;}}usort($out,fn($a,$b)=>$this->plan_role_priority((string)($a['role']??''))<=>$this->plan_role_priority((string)($b['role']??'')));return array_slice($out,0,10);}\n private function wants_complete_kit(array $state):bool{$text=strtolower((string)($state['notes']??'').' '.(string)($state['project_type']??''));return(bool)preg_match('/\\b(everything needed|complete (?:kit|materials|product kit)|all materials|all supplies|including[^.]{0,80}supplies)\\b/',$text);}\n private function plan_role_priority(string $role):int{$map=array('primary_coating'=>10,'primary_product'=>10,'roller'=>20,'tray'=>30,'brush'=>40,'cleaner'=>45,'masking_tape'=>50,'dust_sheet'=>60,'primer'=>70,'filler'=>72,'sandpaper'=>73,'scraper'=>74);return$map[$role]??80;}\n"""
          s=s[:start]+normalise+s[end:]
          start=s.index(' private function roller_component(');end=s.index(' private function tray_width(',start)
          component=""" private function roller_component(array $product):array{$name=strtolower(html_entity_decode((string)($product['name']??''),ENT_QUOTES|ENT_HTML5,'UTF-8'));$text=$this->product_text($product);$name_frame=(bool)preg_match('/\\bframes?\\b/',$name);$name_sleeve=(bool)preg_match('/\\bsleeves?\\b|\\broller covers?\\b|\\broller refills?\\b/',$name);$name_set=(bool)preg_match('/\\b(set|kit|pack|\\d+\\s*pc)\\b/',$name);$name_roller=(bool)preg_match('/\\brollers?\\b/',$name);if($name_frame&&!$name_set&&!$name_sleeve)$kind='frame';elseif($name_sleeve&&!$name_set&&!$name_frame)$kind='sleeve';else{$explicit=(bool)preg_match('/\\b(includes?|contains?|comes with|supplied with|comprises?)\\b[^.]{0,180}(?:\\bframes?\\b[^.]{0,120}\\bsleeves?\\b|\\bsleeves?\\b[^.]{0,120}\\bframes?\\b)/',$text);if(($name_frame&&$name_sleeve)||($name_set&&$name_frame&&$name_roller)||$explicit)$kind='complete';else{$frame=(bool)preg_match('/\\b(?:roller\\s+)?(?:cage\\s+)?frames?\\b|\\bframes?\\s+(?:for|with)\\s+.*\\brollers?\\b/',$text);$sleeve=(bool)preg_match('/\\b(?:roller\\s+)?sleeves?\\b|\\broller\\s+covers?\\b|\\broller\\s+refills?\\b/',$text);$kind=$name_set&&$frame&&$sleeve?'complete':($frame?'frame':($sleeve?'sleeve':'unknown'));}}return array('kind'=>$kind,'width'=>$this->width_inches($name.' '.$text));}\n"""
          s=s[:start]+component+s[end:]
          planner.write_text(s)
          PY
      - name: Validate syntax and component evidence
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          php -r '
          define("ABSPATH", __DIR__);
          function sanitize_text_field($v){return trim((string)$v);} function sanitize_textarea_field($v){return trim((string)$v);} function sanitize_key($v){return strtolower(preg_replace("/[^a-z0-9_-]/","",(string)$v));} function absint($v){return abs((int)$v);} function wp_json_encode($v){return json_encode($v);}
          require "includes/class-orion-semantic-product-planner.php";
          $planner=(new ReflectionClass("Orion_Semantic_Product_Planner"))->newInstanceWithoutConstructor();$r=new ReflectionClass($planner);$component=$r->getMethod("roller_component");$component->setAccessible(true);$normalise=$r->getMethod("normalise_plan");$normalise->setAccessible(true);$decorate=$r->getMethod("decorate_selection");$decorate->setAccessible(true);$validate=$r->getMethod("validate_systems");$validate->setAccessible(true);
          $frame=["id"=>5929,"name"=>"9\" X 1.5\" Roller Cage Frame","description"=>"Compatible with 9 inch roller sleeves","categories"=>["Rollers & Brushes"]];$sleeve=["id"=>5719,"name"=>"6 Piece 9\" Roller Sleeves","categories"=>["Rollers & Brushes"]];$set=["id"=>5726,"name"=>"9 inch 13pc Hi-Performance Roller & Frame Set","categories"=>["Rollers & Brushes"]];if($component->invoke($planner,$frame)["kind"]!=="frame"||$component->invoke($planner,$sleeve)["kind"]!=="sleeve"||$component->invoke($planner,$set)["kind"]!=="complete")exit(1);$decorated=$decorate->invoke($planner,$frame,"roller");[$valid,$reject]=$validate->invoke($planner,[$decorated],["surface"=>"ceiling","area_m2"=>10]);if($valid||!$reject)exit(1);
          $base=[["role"=>"primary_coating","query"=>"ceiling paint","required"=>true],["role"=>"primer","query"=>"primer","required"=>false],["role"=>"filler","query"=>"filler","required"=>false],["role"=>"sandpaper","query"=>"sandpaper","required"=>false],["role"=>"scraper","query"=>"scraper","required"=>false],["role"=>"cleaner","query"=>"cleaner","required"=>false],["role"=>"roller","query"=>"roller","required"=>false],["role"=>"brush","query"=>"brush","required"=>false],["role"=>"tray","query"=>"tray","required"=>false],["role"=>"dust_sheet","query"=>"dust sheet","required"=>false]];$plan=$normalise->invoke($planner,$base,["project_type"=>"painting","surface"=>"ceiling","notes"=>"User wants everything needed for the project."]);$roles=array_column($plan,"role");if(!in_array("masking_tape",$roles,true)||!in_array("dust_sheet",$roles,true)||count($roles)!==10)exit(1);$floor=$normalise->invoke($planner,$base,["project_type"=>"garage floor coating","surface"=>"concrete floor","notes"=>"Find everything needed, including supplies."]);$floor_roles=array_column($floor,"role");if(in_array("dust_sheet",$floor_roles,true)||!in_array("cleaner",$floor_roles,true)||!in_array("masking_tape",$floor_roles,true))exit(1);echo "Kit evidence rules OK\n";
          '
          python3 -m json.tool tests/evals/core-conversations.json >/dev/null
      - name: Commit validated release
        run: |
          rm .github/workflows/finalize-kit-evidence-0116.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-orion-intent-classifier.php includes/class-orion-semantic-product-planner.php .github/workflows/finalize-kit-evidence-0116.yml
          git commit -m "fix: complete explicit roller evidence 0.11.6"
          git push origin feature/semantic-routing
