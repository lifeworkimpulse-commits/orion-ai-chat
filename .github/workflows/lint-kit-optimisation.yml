name: Lint kit optimisation
on:
  push:
    branches: [feature/semantic-routing]
permissions:
  contents: write
jobs:
  lint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/semantic-routing
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Validate evaluation JSON
        run: php -r '$d=json_decode(file_get_contents("tests/evals/core-conversations.json"),true); if(!is_array($d)){exit(1);} echo count($d)," evaluation cases\n";'
      - name: Remove one-time workflow
        run: |
          rm .github/workflows/lint-kit-optimisation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/lint-kit-optimisation.yml
          git commit -m "chore: complete 0.11.1 syntax validation"
          git push origin feature/semantic-routing
