name: Integrate project planner
on:
  push:
    branches: [feature/mvp-hardening]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mvp-hardening
          fetch-depth: 0
      - name: Patch orchestrator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('includes/class-orion-chat-orchestrator.php');s=p.read_text()
          s=s.replace('    private Orion_Ceiling_Calculator $calculator;','    private Orion_Ceiling_Calculator $calculator;\n    private Orion_Project_Planner $planner;',1)
          s=s.replace('        Orion_Tool_Executor $tools,\n        Orion_Ceiling_Calculator $calculator\n    ) {','        Orion_Tool_Executor $tools,\n        Orion_Ceiling_Calculator $calculator,\n        Orion_Project_Planner $planner\n    ) {',1)
          s=s.replace('        $this->calculator = $calculator;','        $this->calculator = $calculator;\n        $this->planner = $planner;',1)
          s=s.replace('$project = $this->ceiling_context($message, $history);','$project = $this->planner->analyse($message, $history);',1)
          s=s.replace("$answer = 'I can prepare a practical ceiling materials list. Please provide the details below.';","$answer = 'I can prepare a complete materials list. Please provide the details below.';",1)
          s=s.replace("$product_intent = $this->is_product_intent($message, $history) || $project['is_ceiling'];","$product_intent = $this->is_product_intent($message, $history) || !empty($project['is_project']);",1)
          s=s.replace("        $estimate = $project['estimate'];","        $estimate = null;\n        if (($project['type'] ?? '') === 'ceiling' && ($project['finish'] ?? '') === 'paint' && !empty($project['area_m2'])) {\n            $calculated = $this->calculator->calculate(array('area_m2' => $project['area_m2'], 'finish' => 'paint'));\n            if (is_array($calculated)) $estimate = $calculated;\n        }",1)
          marker='''        if ($product_intent && !$products) {'''
          block='''        $kit = array('products' => array(), 'missing_roles' => array());
                  if (!empty($project['is_project'])) {
                      $kit = $this->planner->recommend($project, (int) $settings['max_products']);
                      $products = array_merge($products, $kit['products']);
                      if (!empty($kit['products'])) {
                          $messages[] = $assistant;
                          $messages[] = array(
                              'role' => 'user',
                              'content' => "VERIFIED PROJECT KIT FROM LIVE WOOCOMMERCE:\n" . wp_json_encode(array(
                                  'project' => $project,
                                  'products' => $kit['products'],
                                  'missing_roles' => $kit['missing_roles'],
                              )) . "\nWrite a concise customer answer. Group products by purpose. Mention missing categories honestly. Never claim suitability beyond the supplied product data.",
                          );
                          $planned = $client->chat($messages);
                          if (!empty($planned['ok'])) {
                              $assistant = $planned['message'];
                              $usage = $this->combine_usage($usage, $planned['usage']);
                          }
                      }
                  }

          '''
          if marker not in s: raise SystemExit('fallback marker missing')
          s=s.replace(marker,block+marker,1)
          old="        if (!empty($project['is_ceiling'])) return 'ceiling paint primer roller';"
          new="""        if (($project['type'] ?? '') === 'floor_painting') return 'floor paint primer roller brush tray';
                  if (($project['type'] ?? '') === 'exterior_wall_painting') return 'exterior masonry paint primer roller brush scuttle';
                  if (($project['type'] ?? '') === 'ceiling') return (($project['finish'] ?? '') === 'panels') ? 'ceiling panels fixings trim' : 'ceiling paint primer roller brush tray';"""
          if old not in s: raise SystemExit('fallback project line missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('includes/class-orion-product-search.php');s=p.read_text()
          old="'price_text'=>trim(wp_strip_all_tags($html))"
          new="'price_text'=>html_entity_decode(trim(wp_strip_all_tags($html)),ENT_QUOTES|ENT_HTML5,get_bloginfo('charset')?:'UTF-8')"
          if old not in s: raise SystemExit('price text field missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit integration
        run: |
          rm .github/workflows/apply-project-planner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-orion-chat-orchestrator.php includes/class-orion-product-search.php .github/workflows/apply-project-planner.yml
          git commit -m "feat: plan complete project kits by required role"
          git push origin feature/mvp-hardening
