name: Harden shopping answers
on:
  push:
    branches: [feature/semantic-routing]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/semantic-routing
          fetch-depth: 0
      - name: Harden answer prompt and version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('includes/class-orion-chat-orchestrator.php');s=p.read_text()
          old="Write a concise shopping answer using only verified live products. Explain roles. Never invent suitability, compatibility, quantity, price, stock or links."
          new="Write a concise shopping answer using only verified live products. Explain each selected product role. Never invent suitability, compatibility, quantity, coverage, price, stock or links. A product volume or pack size alone does not prove that it is the right quantity for the project area. State quantity or coverage only when explicit numeric manufacturer coverage is present in verified_products; otherwise tell the customer to check the product instructions and do not call the pack size appropriate for the area. Never cite the recommendation itself as evidence. Present missing application tools briefly, then separate primer, filler, sandpaper, scraper and cleaner as conditional preparation items that depend on surface condition. Never imply that every missing optional role is required."
          if old not in s: raise SystemExit('answer prompt marker missing')
          p.write_text(s.replace(old,new,1))
          p=Path('orion-ai-assistant.php');s=p.read_text()
          if 'Version: 0.10.2' not in s or "ORION_AI_VERSION','0.10.2'" not in s: raise SystemExit('version markers missing')
          s=s.replace('Version: 0.10.2','Version: 0.10.3',1).replace("ORION_AI_VERSION','0.10.2'","ORION_AI_VERSION','0.10.3'",1)
          p.write_text(s)
          Path('docs/grounded-shopping-answers.md').write_text('''# Grounded shopping answers\n\nVersion 0.10.3 tightens customer-facing product responses.\n\n- Product volume or pack size is not evidence that the quantity is appropriate for the project area.\n- Quantity and coverage may only be stated when explicit numeric manufacturer coverage is supplied with the verified product data.\n- The model must not cite its own recommendation as verification.\n- Missing application tools are presented briefly.\n- Primer, filler, sandpaper, scraper and cleaner are described as conditional preparation items, not universally required products.\n- Missing optional roles do not suppress a verified principal material or create a manager handoff.\n''')
          PY
      - name: Commit
        run: |
          rm .github/workflows/harden-shopping-answer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-orion-chat-orchestrator.php orion-ai-assistant.php docs/grounded-shopping-answers.md .github/workflows/harden-shopping-answer.yml
          git commit -m "fix: ground coverage and optional preparation language"
          git push origin feature/semantic-routing
