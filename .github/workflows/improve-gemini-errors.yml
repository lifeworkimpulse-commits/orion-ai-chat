name: Improve Gemini diagnostics
on:
  push:
    branches: [feature/mvp-hardening]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mvp-hardening
          fetch-depth: 0
      - name: Patch diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('includes/class-orion-gemini-client.php');s=p.read_text()
          old="""        if($code<200||$code>=300){$public=match($code){400=>'Google Gemini rejected the request or model.',401,403=>'Google Gemini authentication failed.',429=>'Google Gemini is rate limited. Please try again shortly.',default=>'Google Gemini returned an error. Please try again.'};return array('ok'=>false,'error'=>$public,'status'=>$code);}"""
          new="""        if($code<200||$code>=300){
            $raw=is_array($json)?trim(wp_strip_all_tags((string)($json['error']['message']??''))):'';
            $public=match($code){400=>'Google Gemini rejected the request. Check the selected model.',401=>'Google Gemini API key is invalid.',403=>'Google Gemini access is forbidden. Check the API key and whether the Gemini API is enabled.',404=>'Google Gemini model was not found. Enter a model available to this API key.',429=>'Google Gemini is rate limited or its free quota is exhausted.',default=>'Google Gemini returned HTTP '.$code.'. Please try again.'};
            $debug='Google Gemini HTTP '.$code.($raw!==''?': '.$raw:'');
            return array('ok'=>false,'error'=>$public,'debug_error'=>sanitize_text_field($debug),'status'=>$code);
        }"""
          if old not in s: raise SystemExit('Gemini error block not found')
          p.write_text(s.replace(old,new,1))

          p=Path('includes/class-orion-admin-controller.php');s=p.read_text()
          old="$message = !empty($result['ok']) ? ucfirst($settings['provider']) . ' connection successful.' : (string)($result['error'] ?? 'Connection failed.');"
          new="$message = !empty($result['ok']) ? ucfirst($settings['provider']) . ' connection successful.' : (string)($result['debug_error'] ?? $result['error'] ?? 'Connection failed.');"
          if old not in s: raise SystemExit('Admin test message not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit diagnostics
        run: |
          rm .github/workflows/improve-gemini-errors.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-orion-gemini-client.php includes/class-orion-admin-controller.php .github/workflows/improve-gemini-errors.yml
          git commit -m "fix: show actionable Gemini test diagnostics"
          git push origin feature/mvp-hardening
