name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  syntax:
    name: PHP syntax (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0','8.1','8.2','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP files
        shell: bash
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            if ! output="$(php -l "$file" 2>&1)"; then
              message="${output//$'\n'/'%0A'}"
              echo "::error file=${file}::${message}"
              failed=1
            fi
          done < <(find . -name '*.php' -not -path './vendor/*' -print0)
          exit "$failed"

  unit:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock','composer.json') }}
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --no-check-publish
      - run: composer test

  static-analysis:
    name: PHPStan stabilization core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpstan analyse --configuration=phpstan-stabilization.neon

  assets:
    name: Assets and evaluation schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m json.tool tests/evals/core-conversations.json >/dev/null
      - run: node --check assets/widget.js
