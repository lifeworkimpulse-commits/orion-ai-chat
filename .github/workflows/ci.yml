name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0','8.1','8.2','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock','composer.json') }}
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Run unit tests
        run: composer test
      - name: Static analysis
        run: composer analyse
      - name: Validate evaluation suite
        run: python3 -m json.tool tests/evals/core-conversations.json >/dev/null
      - name: Check JavaScript syntax
        run: node --check assets/widget.js
